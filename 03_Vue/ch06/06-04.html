<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>06-04</title>
  </head>
  <body>
    <div id="app">
      <button id="btn1" :style="[ myColor, myLayout ]">태스트</button>
    </div>
    <script src="https://unpkg.com/vue"></script>
    <script>
      var vm = Vue.createApp({
        name: "App",
        data() {
          return {
            myColor: {
              backgroundColor: "purple", 
              color: "yellow" 
            },
            myLayout: {
              width: "150px",
              height: "80px",
              textAlign: "center" 
            },
          };
        },
      }).mount("#app");
    </script>
  </body>
</html>
