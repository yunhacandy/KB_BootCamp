<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>06-08</title>
    <style>
      .btnColor {
        background-color: aqua;
        color: black;
      }
      .btnAlign {
        text-align: center;
        width: 120px;
      }
      .btnBorder {
        border: khaki dashed 1px;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <input type="checkbox" v-model="btnColor" value="true" />
      색상<br />
      <input type="checkbox" v-model="btnAlign" value="true" />
      정렬, 크기<br />
      <input type="checkbox" v-model="btnBorder" value="true" />
      테두리<br />
      <button :class="{ bColor:btnColor, bLayout:btnAlign, bBorder:btnBorder }">버튼</button>
    </div>
    <script src="https://unpkg.com/vue"></script>
    <script>
      let vm = Vue.createApp({
        name: "App",
        data() {
          return {
            btnColor: false,
            btnAlign: false,
            btnBorder: false 
          };
        },
      }).mount("#app");
    </script>
  </body>
</html>
