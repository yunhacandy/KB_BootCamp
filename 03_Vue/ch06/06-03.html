<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>06-03</title>
  </head>
  <body>
    <div id="app">
      <button id="a" :style="{ backgroundColor:backgroundColor, color }"
      @mouseover.stop="overEvent" 
      @mouseout.stop="outEvent">테스트</button>
    </div>
    <script src="https://unpkg.com/vue"></script>
    <script>
      var vm = Vue.createApp({
        name: "App",
        data() {
          return { 
            backgroundColor: "aqua", 
            color: "black" 
          };
        },
        methods: {
          overEvent() {
            this.backgroundColor = "purple";
            this.color = "yellow";
          },
          outEvent() {
            this.backgroundColor = "aqua";
            this.color = "black";
          },
        },
      }).mount("#app");
    </script>
  </body>
</html>
