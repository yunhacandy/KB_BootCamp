<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>06-09</title>
    <style>
      .btnColor {
        background-color: aqua;
        color: black;
      }
      .btnAlign {
        text-align: center;
        width: 120px;
      }
      .btnBorder {
        border: khaki dashed 1px;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <input type="checkbox" v-model="btnStyle
      .bColor" value="true" />색상<br />
      <input type="checkbox" v-model="btnStyle
      .bLayout" value="true" />정렬,크기<br />
      <input type="checkbox" v-model="btnStyle
      .bBorder" value="true" />테두리선<br />
      <button :class="btnStyle
      ">버튼</button>
    </div>
    <script src="https://unpkg.com/vue"></script>
    <script>
      let vm = Vue.createApp({
        name: "App",
        data() {
          return {
            btnStyle
            : { bColor: false, bLayout: false, bBorder: false },
          };
        },
      }).mount("#app");
    </script>
  </body>
</html>
