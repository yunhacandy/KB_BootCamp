<!doctype html>
<html lang="en">
  <head></head>
  <body>
    <ul>
      <li>철수</li>
      <li>지민</li>
      <li>영희</li>
    </ul>

    <script>
      const list = document.getElementsByTagName('li');
      for (let i = list.length - 1; i >= 0; i--) {
        list[i].remove();
      }
    </script>
  </body>
</html>
